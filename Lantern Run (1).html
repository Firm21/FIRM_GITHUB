<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
:root{--bg:#14112b;--ink:#f3e9d2;--dim:#9b8fb8;--btn:#2b2147;--edge:#ffb347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112b;--ink:#f3e9d2;--dim:#9b8fb8;--btn:#2b2147;--edge:#ffb347}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9dfc6;--ink:#2b2147;--dim:#6d6288;--btn:#f3e9d2;--edge:#c9741a}}
:root[data-theme="dark"]{--bg:#14112b;--ink:#f3e9d2;--dim:#9b8fb8;--btn:#2b2147;--edge:#ffb347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:min(100%,960px);aspect-ratio:640/352;image-rendering:pixelated;border:3px solid var(--edge);border-radius:6px;background:#1b1840;display:block}
p{margin:0;font-size:13px;color:var(--dim);text-align:center;line-height:1.6}
#tc{display:none;width:min(100%,960px);justify-content:space-between;gap:10px}
#tc div{flex:1;height:64px;display:flex;align-items:center;justify-content:center;background:var(--btn);border:2px solid var(--edge);border-radius:8px;font-size:20px;color:var(--ink)}
#tc div.on{background:var(--edge);color:#14112b}
#tc #bj{flex:2}
@media (pointer:coarse){#tc{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="640" height="352" tabindex="0" aria-label="Lantern Run platformer game"></canvas>
<div id="tc"><div id="bl">&lt;</div><div id="br">&gt;</div><div id="bj">JUMP</div></div>
<p>Move: arrows or A/D. Jump: Space or W. Tap the screen to start.</p>
<script>
const T=32,W=640,H=352,ROWS=11,cv=document.getElementById('c'),X=cv.getContext('2d');
const LV=[
{n:'Market Lane',w:56,g:[[0,10],[13,25],[29,34],[38,47],[50,55]],p:[[8,6,3],[17,6,3],[21,4,3],[31,6,2],[40,6,4]],s:[],e:[16,44,52],f:54},
{n:'Rooftop Run',w:64,g:[[0,6],[9,18],[21,26],[30,40],[43,48],[52,63]],p:[[7,6,2],[12,6,3],[19,6,2],[27,6,2],[33,6,3],[41,6,2],[49,6,2],[56,6,3]],s:[[14,2],[23,2],[34,2],[44,2],[57,2]],e:[11,24,37,46,60],f:62},
{n:'Midnight Gaps',w:72,g:[[0,5],[9,13],[17,20],[24,30],[34,36],[40,47],[51,53],[57,62],[65,71]],p:[[6,6,2],[14,6,2],[21,6,2],[31,6,2],[37,6,2],[48,6,2],[54,6,2],[63,6,2]],s:[[10,2],[25,2],[41,2],[66,1]],e:[12,27,44,59,68],f:70}
];
const M={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
const I={l:0,r:0,j:0};let jb=0,S='title',st=0,lv=0,lives=3,score=0,lvScore=0,G,gw,P,E,L,PT=[],cx=0,tick=0,AC;
const stars=Array.from({length:50},(_,i)=>[(i*97)%W,(i*53)%190,i%3+1]);
function beep(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function load(i){const d=LV[i];gw=d.w;G=Array.from({length:ROWS},()=>new Array(gw).fill(0));L=[];E=[];PT=[];
d.g.forEach(([a,b])=>{for(let c=a;c<=b;c++){G[9][c]=1;G[10][c]=1}for(let c=a+1;c<b;c+=3)L.push({x:c*T+16,y:7*T+10,got:0})});
d.p.forEach(([a,r,n])=>{for(let c=a;c<a+n;c++)G[r][c]=1;L.push({x:(a+n/2)*T,y:(r-1)*T+10,got:0})});
d.s.forEach(([a,n])=>{for(let c=a;c<a+n;c++)G[8][c]=2});
d.e.forEach(c=>E.push({x:c*T+4,y:8*T+6,w:24,h:26,vx:-.9,dead:0}));
P={x:T+6,y:9*T-28,w:20,h:28,vx:0,vy:0,on:0,co:0,f:1};lvScore=score;cx=0}
function begin(i,l,s){lv=i;lives=l;score=s;load(i);S='play';st=0}
function solid(x,y,w,h){const a=Math.floor(x/T),b=Math.floor((x+w-1)/T),c=Math.floor(y/T),d=Math.floor((y+h-1)/T);
if(x<0||x+w>gw*T)return 1;for(let r=c;r<=d;r++)for(let q=a;q<=b;q++)if(r>=0&&r<ROWS&&G[r][q]===1)return 1;return 0}
function burst(x,y,c,n){for(let i=0;i<n;i++)PT.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,l:30,c})}
function die(){if(S!=='play')return;S='dead';st=0;burst(P.x+10,P.y+14,'#ff5d73',24);beep(120,.5,'sawtooth',.07)}
function update(){tick++;st++;
PT.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l--});PT=PT.filter(p=>p.l>0);
if(S==='dead'){if(st>55){lives--;if(lives<=0){S='over';st=0}else{score=lvScore;load(lv);S='play';st=0}}return}
if(S==='clear'){if(st>100){if(lv+1>=LV.length){S='win';st=0}else begin(lv+1,lives,score)}return}
if(S!=='play')return;
const dir=I.r-I.l;P.vx+=(dir*3-P.vx)*.35;if(dir)P.f=dir;
if(P.on)P.co=6;else P.co--;jb--;
if(jb>0&&P.co>0){P.vy=-12;jb=0;P.co=0;beep(440,.12,'square',.04)}
if(!I.j&&P.vy<-4)P.vy=-4;
P.vy=Math.min(P.vy+.55,12);
P.x+=P.vx;if(solid(P.x,P.y,P.w,P.h)){P.x=P.vx>0?Math.floor((P.x+P.w)/T)*T-P.w:(Math.floor(P.x/T)+1)*T;P.vx=0}
P.y+=P.vy;P.on=0;if(solid(P.x,P.y,P.w,P.h)){if(P.vy>0){P.y=Math.floor((P.y+P.h)/T)*T-P.h;P.on=1}else P.y=(Math.floor(P.y/T)+1)*T;P.vy=0}
if(P.y>H+40)return die();
for(let r=Math.floor(P.y/T);r<=Math.floor((P.y+P.h-1)/T);r++)for(let q=Math.floor(P.x/T);q<=Math.floor((P.x+P.w-1)/T);q++)
if(G[r]&&G[r][q]===2&&P.y+P.h>r*T+16)return die();
E.forEach(e=>{if(e.dead)return;e.x+=e.vx;const fx=e.vx>0?e.x+e.w+1:e.x-1,col=Math.floor(fx/T);
const wall=solid(fx,e.y,1,e.h),floor=G[9]&&G[Math.floor((e.y+e.h+2)/T)]&&G[Math.floor((e.y+e.h+2)/T)][col]===1;
if(wall||!floor)e.vx*=-1;
if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){if(P.vy>0&&P.y+P.h-e.y<18){e.dead=1;P.vy=-8;score+=50;burst(e.x+12,e.y+12,'#ffb347',14);beep(660,.1,'triangle',.06)}else return die()}});
L.forEach(l=>{if(!l.got&&Math.hypot(P.x+10-l.x,P.y+14-l.y)<22){l.got=1;score+=10;burst(l.x,l.y,'#ffd27a',8);beep(880,.08,'sine',.06)}});
const gx=LV[lv].f*T;if(P.x+P.w>gx+4&&P.x<gx+30&&P.y+P.h>9*T-96){S='clear';st=0;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.07),i*120))}
cx=Math.max(0,Math.min(gw*T-W,P.x-W/2+10))}
function txt(s,x,y,sz,c,a){X.font=`${sz}px Silkscreen, monospace`;X.textAlign=a||'center';X.fillStyle=c||'#f3e9d2';X.fillText(s,x,y)}
function draw(){
const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1840');g.addColorStop(.6,'#4a2a5e');g.addColorStop(1,'#c4577a');X.fillStyle=g;X.fillRect(0,0,W,H);
stars.forEach(([x,y,s])=>{X.fillStyle='rgba(243,233,210,.7)';X.fillRect((x-cx*.05+W*4)%W,y,s,s)});
X.fillStyle='#f3e9d2';X.beginPath();X.arc(500,70,26,0,7);X.fill();X.fillStyle='#e6d6b4';X.beginPath();X.arc(508,64,22,0,7);X.fill();
[[.2,'#3a2760',250],[.45,'#2b1d4d',285]].forEach(([k,c,b])=>{X.fillStyle=c;for(let i=0;i<W;i+=8){const y=b+Math.sin((i+cx*k)*.012)*28+Math.sin((i+cx*k)*.031)*10;X.fillRect(i,y,8,H-y)}});
X.save();X.translate(-Math.round(cx),0);
const a=Math.floor(cx/T),b=a+21;
for(let r=0;r<ROWS;r++)for(let c=a;c<=b&&c<gw;c++){const t=G[r][c],x=c*T,y=r*T;
if(t===1){X.fillStyle='#2b2147';X.fillRect(x,y,T,T);X.fillStyle='#3a2d5e';X.fillRect(x,y+T-2,T,2);X.fillRect(x+T-2,y,2,T);
if(!G[r-1]||G[r-1][c]!==1){X.fillStyle='#ffb347';X.fillRect(x,y,T,5);X.fillStyle='#ff8a3d';X.fillRect(x,y+5,T,2)}}
else if(t===2){X.fillStyle='#f3e9d2';for(let k=0;k<2;k++){X.beginPath();X.moveTo(x+k*16,y+T);X.lineTo(x+k*16+8,y+14);X.lineTo(x+k*16+16,y+T);X.fill()}}}
const gx=LV[lv].f*T,gy=9*T;X.fillStyle='#ff5d73';X.fillRect(gx+4,gy-96,6,96);X.fillRect(gx+22,gy-96,6,96);X.fillRect(gx-4,gy-100,40,8);X.fillRect(gx,gy-80,32,5);
L.forEach(l=>{if(l.got)return;const y=l.y+Math.sin(tick*.06+l.x)*3,r=X.createRadialGradient(l.x,y,2,l.x,y,24);r.addColorStop(0,'rgba(255,190,90,.55)');r.addColorStop(1,'rgba(255,190,90,0)');X.fillStyle=r;X.fillRect(l.x-24,y-24,48,48);
X.fillStyle='#ff8a3d';X.fillRect(l.x-6,y-8,12,16);X.fillStyle='#ffd27a';X.fillRect(l.x-3,y-5,6,10);X.fillStyle='#2b2147';X.fillRect(l.x-4,y-10,8,2);X.fillRect(l.x-4,y+8,8,2)});
E.forEach(e=>{if(e.dead)return;const cxE=e.x+12,cyE=e.y+13;X.fillStyle='#ff5d73';X.beginPath();X.arc(cxE,cyE,13,0,7);X.fill();X.fillStyle='#14112b';X.fillRect(cxE-9,cyE+8,18,5);
X.fillStyle='#fff';X.fillRect(cxE-7,cyE-5,5,6);X.fillRect(cxE+2,cyE-5,5,6);X.fillStyle='#14112b';const o=e.vx>0?2:0;X.fillRect(cxE-6+o,cyE-3,2,3);X.fillRect(cxE+3+o,cyE-3,2,3)});
if(S!=='dead'){const sq=P.on?0:Math.min(3,Math.abs(P.vy)/4);X.fillStyle='#3ddbd0';X.fillRect(P.x-sq/2,P.y+4,P.w+sq,P.h-4-(P.on&&Math.abs(P.vx)>1&&tick%12<6?2:0));
X.fillStyle='#2aa79e';X.fillRect(P.x,P.y+P.h-6,P.w,6);X.fillStyle='#ffb347';X.fillRect(P.f>0?P.x-6:P.x+P.w,P.y+10,6,5);X.fillRect(P.x,P.y+8,P.w,4);
X.fillStyle='#3ddbd0';X.fillRect(P.x+2,P.y,6,6);X.fillRect(P.x+12,P.y,6,6);
X.fillStyle='#fff';X.fillRect(P.x+(P.f>0?10:3),P.y+14-(8),7,7);X.fillStyle='#14112b';X.fillRect(P.x+(P.f>0?14:3),P.y+8,3,4)}
PT.forEach(p=>{X.fillStyle=p.c;X.fillRect(p.x,p.y,3,3)});
X.restore();
if(S==='title'){X.fillStyle='rgba(20,17,43,.78)';X.fillRect(0,0,W,H);txt('LANTERN RUN',W/2,130,44,'#ffb347');txt('Gather lanterns. Stomp soot sprites.',W/2,175,14);txt('Reach the red gate on each rooftop.',W/2,198,14);if(tick%60<40)txt('Press Enter or tap to start',W/2,260,16,'#3ddbd0')}
else{txt('LANTERNS '+score,14,24,14,'#ffb347','left');txt(LV[lv].n,W/2,24,14);txt('LIVES '+'*'.repeat(Math.max(0,lives)),W-14,24,14,'#ff5d73','right')}
if(S==='clear'){X.fillStyle='rgba(20,17,43,.6)';X.fillRect(0,110,W,100);txt('LEVEL CLEAR',W/2,170,32,'#ffb347')}
if(S==='over'){X.fillStyle='rgba(20,17,43,.85)';X.fillRect(0,0,W,H);txt('LIGHTS OUT',W/2,150,38,'#ff5d73');txt('Score '+score,W/2,190,16);txt('Press Enter or tap to try again',W/2,240,14,'#3ddbd0')}
if(S==='win'){X.fillStyle='rgba(20,17,43,.88)';X.fillRect(0,0,W,H);txt('THE MARKET IS LIT',W/2,140,34,'#ffb347');txt('Final score '+score,W/2,185,18);txt('Press Enter or tap to play again',W/2,240,14,'#3ddbd0')}}
function adv(){if(S==='title')begin(0,3,0);else if(S==='over'||S==='win'){S='title';st=0}}
addEventListener('keydown',e=>{if(M[e.code]){e.preventDefault();if(!e.repeat&&M[e.code]==='j'){jb=6;adv()}I[M[e.code]]=1}else if(e.code==='Enter'){adv()}});
addEventListener('keyup',e=>{if(M[e.code])I[M[e.code]]=0});
cv.addEventListener('pointerdown',()=>{adv();cv.focus()});
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const el=document.getElementById(id);
const on=e=>{e.preventDefault();I[k]=1;el.classList.add('on');if(k==='j'){jb=6;adv()}},off=e=>{e.preventDefault();I[k]=0;el.classList.remove('on')};
el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,off))});
load(0);let last=0,acc=0;
function frame(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
